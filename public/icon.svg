<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Minimalist Flat Dark Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#0c0c0c" stroke="#252536" stroke-width="8" />

  <!-- Clean 2D Left Bracket < -->
  <path
    d="M 200 160 L 105 256 L 200 352"
    fill="none"
    stroke="#34d058"
    stroke-width="36"
    stroke-linecap="round"
