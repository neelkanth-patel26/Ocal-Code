<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151f" />
      <stop offset="50%" stop-color="#0c0c10" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#e8ff47" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d058" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34d058" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Outer Ambient Glow Orbs -->
  <circle cx="140" cy="140" r="100" fill="#34d058" opacity="0.08" filter="url(#glow)" />
  <circle cx="370" cy="370" r="120" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Code Bracket Left < -->
  <path d="M 190 170 L 115 256 L 190 342" fill="none" stroke="url(#emeraldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />

  <!-- Code Bracket Right > -->
  <path d="M 322 170 L 397 256 L 322 342" fill="none" stroke="url(#cyanGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />

  <!-- Central Modern Slash / Energy Core -->
  <path d="M 285 145 L 227 367" fill="none" stroke="url(#limeGrad)" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central Pulse Orb -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#subtleGlow)" />
</svg>
